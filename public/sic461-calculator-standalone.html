escription,detail:`Резистор R_MODE, подключенный между выводом 27 (MODE) и аналоговой землей AGND, конфигурирует режим работы внутреннего ШИМ-контроллера и источника питания драйверов затворов (Таблица 1, стр. 9 даташита):`,table:[{mode:`Mode 1`,res:`2.0 kΩ (или AGND)`,desc:`Power Save Mode (PSM) включен, внутренний регулятор VDRV 5V включен.`},{mode:`Mode 2`,res:`301 kΩ (1%)`,desc:`Forced Continuous Conduction (FCCM) непрерывный режим, внутренний VDRV 5V включен.`},{mode:`Mode 3`,res:`499 kΩ (1%)`,desc:`FCCM непрерывный режим, внутренний LDO выключен, питание VDRV от внешней шины 5V.`},{mode:`Mode 4`,res:`1000 kΩ (1 MΩ, 1%)`,desc:`PSM энергосберегающий режим, внутренний LDO выключен, питание VDRV от внешней 5V.`}],layoutNote:`Трассировать резистор R_MODE непосредственно к выводу 27 и тихой земле AGND (вывод 17/23). Не прокладывать рядом с импульсным узлом SW.`};case`FSW`:case`PIN_24`:return{pin:`Пин 24: fSW`,title:`Программирование частоты переключения`,value:`R_FSW = ${t.rfswKohm.formatted} → Fsw = ${t.actualFswKhz} кГц`,formula:`Rfsw = Vout / (fsw · 1.9e-10)`,detail:`Задает время открытого состояния верхнего ключа ton, пропорциональное выходному напряжению Vout. Для fsw = ${t.actualFswKhz} кГц и Vout = ${t.voutActual} В расчетное значение Rfsw = ${t.rfswKohm.theoretical} кОм. Ближайший стандарт E96 — ${t.rfswKohm.nominal} кОм.`,layoutNote:`Резистор R_FSW подключается между выводом 24 и AGND. Трассировка должна быть минимальной длины в экранированном слое.`};case`PHASE`:case`PIN_5_6`:case`BOOT`:case`PIN_4`:return{pin:`Пины 4 (BOOT) и 5, 6 (PHASE1, PHASE2)`,title:`Бутстрепная накачка и демпфирование dV/dt`,value:`C_BOOT = ${t.cbootNf.formatted}, R_BOOT = ${t.rbootOhm.formatted}`,detail:`Питает плавающий драйвер верхнего силового MOSFET. Керамический конденсатор C_BOOT (100 нФ X7R ≥25В) включается последовательно с резистором R_BOOT (3.3 Ω для SiC461/462, 4.7 Ω для SiC463/464) между выводом BOOT и выводами PHASE1/PHASE2.`,layoutNote:`КРИТИЧНО ДЛЯ EMI: Резистор R_BOOT демпфирует крутизну фронтов переключения dV/dt и гасит звон в узле фазы. Возвратный проводник от C_BOOT/R_BOOT должен подключаться строго к выводам PHASE1/2 (5, 6), а не к силовым выводам SW (7-10)!`};case`VDRV`:case`PIN_16`:return{pin:`Пин 16: VDRV`,title:`Питание драйверов силовых ключей`,value:`C_VDRV = ${t.cvdrvUf.formatted}`,detail:`Напряжение шины питания затворов (5.0 В). ${t.vdrvSupplySource}. Потери в кристалле: ${t.vdrvPowerLossW} Вт. В режимах Mode 3 и 4 при питании VDRV от внешней шины 5В (или от выхода Vout, если Vout=5В) полностью исключаются потери в линейном стабилизаторе, что дает выигрыш в КПД до 3-5% и снижает нагрев кристалла.`,layoutNote:`Керамический конденсатор C_VDRV = 4.7 µF (X7R 10V+) монтируется прямо у вывода 16 и вывода 15 PGND с минимальной паразитной индуктивностью контура.`};case`COMP`:case`PIN_21`:return{pin:`Пин 21: COMP`,title:`Частотная коррекция транскондуктивного усилителя ошибки`,value:`R_COMP = ${t.rcompKohm.formatted}, C_COMP = ${t.ccompPf.formatted}`,formula:`fc ≈ fsw / 10, gm = 300 µS`,detail:`Внутренний транскондуктивный усилитель ошибки (gm = 300 µS) стабилизирует выходное напряжение. Расчетная частота среза петли fc = ${t.crossoverFreqKhz} кГц. Двойной LC-полюс выходного фильтра расположен на частоте f_LC = ${t.lcPoleFreqKhz} кГц. Последовательная RC-цепочка R_COMP + C_COMP формирует нуль компенсации.`,layoutNote:`Подключается к выводу COMP (21) и возвращается на аналоговую землю AGND. Должна быть удалена от силовых трасс SW и дросселя.`};case`VSNS`:case`PIN_20`:return{pin:`Пин 20: VSNS`,title:`Инжекция пилы для устойчивости COT (Constant On-Time)`,value:`Rx = ${t.rxKohm.formatted}, Cy = ${t.cyNf.formatted}, Cx = ${t.cxNf.formatted} → Vramp = ${t.vrampMinMv}..${t.vrampMaxMv} мВ`,formula:`Vramp = ((Vin - Vout) · Vout) / (Vin · fsw · Cx · Rx)`,detail:`Поскольку современные керамические конденсаторы MLCC имеют сверхнизкий ESR, естественной пилы на выходе недостаточно для работы компаратора COT. Цепь Rx (от узла SW) и Cx (к шине VOUT) синтезирует пилу напряжения. Конденсатор Cy подключается непосредственно к выводу 20 (VSNS), передавая пилу и отсекая постоянную составляющую. Рекомендуемый диапазон амплитуды: 100..900 мВ. Текущий диапазон: ${t.vrampMinMv}..${t.vrampMaxMv} мВ (при Vin = ${e.vinMin}..${e.vinMax} В).`,layoutNote:`Конденсатор Cy подключается непосредственно к выводу 20 (VSNS) микросхемы. Резистор Rx рассеивает до 25 мВт (типоразмер 0603). Сигнал VSNS снимается кельвиновским подключением.`};case`L1`:case`SW`:case`PIN_7_10`:return{pin:`Пины 7, 8, 9, 10: SW`,title:`Силовой импульсный узел переключения и дроссель L1`,value:`L1 = ${t.lNominal.formatted} (расчетное: ${t.lCalcUh} µH)`,detail:`Рейтинг дросселя: Isat ≥ ${(t.iPeak*1.3).toFixed(1)} A, Irms ≥ ${(t.iRms*1.15).toFixed(1)} A. Размах пульсаций тока дросселя ΔIL = ${t.actualDeltaIL} A (${(t.actualKind*100).toFixed(0)}% от Iout). Потери в активном сопротивлении меди DCR ≈ ${t.inductorDcrLossW} Вт.`,layoutNote:`Полигон SW должен иметь минимально необходимую площадь для уменьшения емкостной связи и EMI излучения, но достаточную медь для отвода тепла (минимум 2 oz).`};case`VFB`:case`PIN_22`:return{pin:`Пин 22: VFB`,title:`Вход обратной связи по напряжению`,value:`R_FB_H = ${t.rfbTop.formatted}, R_FB_L = ${t.rfbBottom.formatted}`,formula:`Vout = Vref · (1 + R_FB_H / R_FB_L), Vref = 0.800 В`,detail:`Фактическое выходное напряжение: ${t.voutActual} В (погрешность ${t.voutErrorPercent>0?`+`:``}${t.voutErrorPercent}%). Делитель задаёт Vout = Vref · (1 + R_FB_H / R_FB_L).`,layoutNote:`Вывод VFB является высокоомным чувствительным узлом. Дорожка от делителя к выводу 22 должна быть максимально короткой и экранирована земляным полигоном.`};case`SS`:case`PIN_19`:return{pin:`Пин 19: SS`,title:`Программирование плавного пуска (Soft-Start)`,value:`C_SS = ${t.cssNf.formatted} (E24) → Tss = ${t.actualTssMs} мс`,formula:`Tss = (Css · 0.8В) / 5.0 µA`,detail:`Внутренний источник тока 5 мкА заряжает конденсатор CSS, обеспечивая плавное монотонн
